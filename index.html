<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Zeitrechner" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Zeitrechner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="src/app.css" />
</head>
<body>
  <main class="app" id="app">
    <nav class="modebar" id="modebar" aria-label="Rechnermodus">
      <button type="button" data-mode="time" class="modetab active" aria-pressed="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Zeit
      </button>
      <button type="button" data-mode="num" class="modetab" aria-pressed="false">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="10" x2="16" y2="14"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/></svg>
        Rechner
      </button>
      <button type="button" class="info-btn" id="infoBtn" aria-label="Informationen und Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="12" y1="7" x2="12.01" y2="7"/></svg>
      </button>
    </nav>

    <section class="tape-wrap" aria-label="Rechenverlauf">
      <div class="tape" id="tape" tabindex="0"></div>
      <div class="total">
        <span class="lbl">SUMME</span>
        <div class="right">
          <div class="total-value">
            <output class="sum-minutes" id="sumMinutes" aria-label="Summe in Minuten"></output>
            <button type="button" class="undo" id="undo" aria-label="Letzten Schritt zurück" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 1 1-4.2 10.3"/></svg>
            </button>
            <output class="sum" id="sum" aria-label="Summe">0</output>
          </div>
        </div>
      </div>
    </section>

    <section class="display" aria-label="Aktuelle Eingabe" aria-live="polite" aria-atomic="true">
      <div class="pending" id="pending" aria-hidden="true"></div>
      <div class="current-line">
        <output class="current" id="current">0</output>
      </div>
    </section>

    <div class="parenbar" aria-label="Klammern">
      <button type="button" id="openParen" aria-label="Klammer auf">(</button>
      <button type="button" id="closeParen" aria-label="Klammer zu" disabled>)</button>
    </div>

    <div class="pad" id="pad" aria-label="Tastenfeld"></div>
  </main>

  <dialog id="aboutDialog" class="about-dialog" aria-labelledby="aboutTitle">
    <div class="about-card">
      <img class="about-icon" src="icon-192.png" alt="" />
      <h2 class="about-title" id="aboutTitle">Zeitrechner</h2>
      <p class="about-sub">Rechnen mit Zeiten und Zahlen.</p>
      <p class="about-version">__COMMIT__</p>
      <label class="sound-setting" for="soundToggle">
        <span class="setting-label">Tastenklicks</span>
        <span class="sound-switch">
          <input type="checkbox" id="soundToggle" />
          <span class="sound-slider" aria-hidden="true"></span>
        </span>
      </label>
      <div class="layout-setting">
        <span class="setting-label">Verlauf</span>
        <div class="side-options" id="historySideOptions" role="radiogroup" aria-label="Position des Verlaufs im Querformat">
          <input type="radio" id="historyLeft" name="historySide" value="left" />
          <label for="historyLeft">Links</label>
          <input type="radio" id="historyRight" name="historySide" value="right" />
          <label for="historyRight">Rechts</label>
        </div>
      </div>
      <button type="button" class="about-close" id="aboutClose">Schließen</button>
    </div>
  </dialog>

  <script src="src/calculator-core.js"></script>
  <script src="src/state-store.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
